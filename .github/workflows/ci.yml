name: S.S. Pharmacy CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Run Unit Tests
      run: npm run test

    - name: Run Production Build
      run: npm run build
      env:
        NEXT_PUBLIC_SITE_URL: https://sspharmacy.com
        JWT_SECRET: dummy-test-jwt-secret-at-least-32-chars-long
        SUPABASE_SERVICE_ROLE_KEY: dummy-supabase-service-role-key

    - name: Run Dependency Vulnerability Scan
      run: npm audit --audit-level=high
